name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    name: Build and Deploy Job
    if: >
      github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Static Web Apps deployment token
        shell: bash
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_WAVE_0E4D8D403 }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_WAVE_0E4D8D403 is empty or unavailable"
            exit 1
          fi
          echo "Deployment token is available"
          echo "Token length: ${#SWA_TOKEN}"
          
      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_WAVE_0E4D8D403 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          skip_app_build: true

  close_pull_request_job:
    name: Close Pull Request Job
    if: >
      github.event_name == 'pull_request' && github.event.action == 'closed'

    runs-on: ubuntu-latest

    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_WAVE_0E4D8D403 }}
          action: close
          app_location: /
